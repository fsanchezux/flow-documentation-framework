<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowDocs — Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { height: 100vh; }
    #docs { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="docs"></div>

  <script src="../dist/flow-docs.min.js"></script>
  <script>
    FlowDocs.init({
      container: '#docs',
      github: {
        owner: 'fsanchezux',
        repo: 'flow-documentation-framework',
        branch: 'master',
        // token: 'ghp_...'  // opcional para repos privados o subir rate limit
      }
    })
  </script>
</body>
</html>
